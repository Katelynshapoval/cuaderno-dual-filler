<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Portal replica</title>
  </head>
  <body>
    <!-- Réplica del formulario real de /fct/desarrollo.*.do (mismos ids y validación), sin datos personales. -->
    <div id="error_container" style="display: none">
      <ul id="error_label_container"><li class="elementoOculto">Listado de errores</li></ul>
    </div>
    <form action="#" id="formulario" name="formulario">
      <fieldset>
        <legend>Detalle del programa</legend>
        <div class="seemTr">
          <div><label for="numHorasTotales">Horas totales:&nbsp;</label></div>
          <div>0</div>
        </div>
      </fieldset>
      <fieldset>
        <legend>Detalle del Desarrollo</legend>
        <div class="seemTr">
          <div>&nbsp;</div>
          <div><label for="fecha">Fecha (dd/mm/yyyy)*:&nbsp;</label></div>
          <div>
            <div id="calFECHA" style="position: absolute; visibility: hidden"></div>
            <input type="text" name="FECHA" id="FECHA" value="11/11/2026" size="12" maxlength="10" />
            <a href="javascript:void(0)" id="BTN_FECHA" title="Abrir calendario">cal</a>
          </div>
          <div><label for="horas">Horas*:&nbsp;</label></div>
          <div><input type="text" id="HORAS" name="HORAS" maxlength="9" size="10" value="8" /></div>
        </div>
        <div class="seemTr js-count-field">
          <div><label for="descripcion">Descripción de las Actividades desarrolladas* (<span>0</span>/<span>2000</span> caracteres):&nbsp;</label></div>
          <div><textarea cols="82" rows="5" id="descripcion" name="descripcion" maxlength="2000"></textarea></div>
        </div>
        <div class="seemTr">
          <div><label for="observaciones">Observaciones (<span>0</span>/<span>2000</span> caracteres):&nbsp;</label></div>
          <div><textarea cols="82" rows="5" name="OBSERVACIONES" id="OBSERVACIONES" maxlength="2000"></textarea></div>
        </div>
        <div class="seemTr">
          <div><label for="dificultades">Dificultades en la realización:&nbsp;</label></div>
          <div><textarea cols="82" rows="2" name="DIFICULTADES" id="DIFICULTADES"></textarea></div>
        </div>
        <div class="seemTr">
          <button type="button" class="boton" id="593804895" value="nueva" onclick="javascript: nuevo()">Nueva</button>
        </div>
      </fieldset>
      <table summary="Descripción de actividades Desarrolladas">
        <caption>Descripción de actividades Desarrolladas</caption>
        <thead>
          <tr><th>Descripción</th><th>Fecha</th><th>Horas</th><th>Editar</th></tr>
        </thead>
        <tbody id="listado"></tbody>
      </table>
      <button type="button" class="boton" value="volver">Volver</button>
      <button type="button" class="boton" value="borrar">Borrar</button>
    </form>
    <pre id="result">RUNNING</pre>

    <script>
      const PAGE_SIZE = 2;
      const read = (key, fallback) => JSON.parse(sessionStorage.getItem(key) || JSON.stringify(fallback));
      const write = (key, value) => sessionStorage.setItem(key, JSON.stringify(value));

      // Lo que hace el portal: validar y enviar el formulario (recarga la página).
      function nuevo() {
        const fecha = document.getElementById("FECHA").value;
        const horas = document.getElementById("HORAS").value;
        const descripcion = document.getElementById("descripcion").value;
        if (!fecha || !horas || !descripcion) return alert("Debe rellenar todos los campos obligatorios.");
        if (!/^\d{2}\/\d{2}\/\d{4}$/.test(fecha)) return alert("El formato de la fecha no es válido");
        if (isNaN(horas) || Number(horas) == 0) return alert("El formato para las horas no es válido");
        const saved = read("saved", []);
        write("reloads", read("reloads", 0) + 1);
        // Como el portal: si la fecha ya existe, vuelve con ese día cargado en modo Actualizar.
        if (saved.some((row) => row.fecha === fecha)) {
          write("mode", { fecha });
          return location.reload();
        }
        saved.push({
          fecha,
          horas,
          descripcion,
          observaciones: document.getElementById("OBSERVACIONES").value,
          dificultades: document.getElementById("DIFICULTADES").value,
        });
        saved.sort((a, b) => a.fecha.split("/").reverse().join("").localeCompare(b.fecha.split("/").reverse().join("")));
        write("saved", saved);
        location.reload();
      }

      function actualizar() {
        write("overwritten", read("overwritten", 0) + 1);
        write("mode", null);
        location.reload();
      }

      function paginar() {
        write("mode", null);
        write("paginated", read("paginated", 0) + 1);
        location.reload();
      }

      const mode = read("mode", null);
      if (mode) {
        const row = read("saved", []).find((item) => item.fecha === mode.fecha);
        document.getElementById("FECHA").value = mode.fecha;
        document.getElementById("descripcion").value = row ? row.descripcion : "";
        const button = document.getElementById("593804895");
        button.value = "actualizar";
        button.setAttribute("onclick", "javascript: actualizar()");
        button.textContent = "Actualizar";
      }

      const listado = document.getElementById("listado");
      const page = read("saved", []).slice(0, PAGE_SIZE);
      listado.innerHTML = page.length
        ? page.map((row) => `<tr><td>${row.descripcion}</td><td>${row.fecha}</td><td>${row.horas}</td><td></td></tr>`).join("")
        : '<tr><td colspan="5">No hay datos</td></tr>';

      // chrome.* falso que sobrevive a las recargas.
      const listeners = [];
      globalThis.chrome = {
        runtime: {
          lastError: null,
          sendMessage(message, callback) {
            if (callback) callback(message.type === "WHOAMI" ? { tabId: 1 } : { ok: true });
          },
          onMessage: { addListener() {} },
        },
        storage: {
          local: {
            get(key, callback) {
              callback({ [key]: read(`store:${key}`, null) ?? undefined });
            },
            set(obj, callback) {
              const changes = {};
              for (const [key, value] of Object.entries(obj)) {
                write(`store:${key}`, value);
                changes[key] = { newValue: value };
              }
              listeners.forEach((fn) => fn(changes, "local"));
              if (callback) callback();
            },
          },
          onChanged: { addListener(fn) { listeners.push(fn); } },
        },
      };

      if (!sessionStorage.getItem("started")) {
        sessionStorage.setItem("started", "1");
        // 10/11 ya está registrado pero fuera de la primera página del listado.
        write("saved", [
          { fecha: "01/11/2026", horas: "4", descripcion: "Antes", observaciones: "", dificultades: "" },
          { fecha: "02/11/2026", horas: "4", descripcion: "Antes", observaciones: "", dificultades: "" },
          { fecha: "10/11/2026", horas: "6", descripcion: "Ya estaba", observaciones: "", dificultades: "" },
        ]);
        const entries = [
          ["09/11/2026", "8"],
          ["10/11/2026", "7,5"],
          ["11/11/2026", "3"],
        ].map(([fecha, horas]) => ({
          fecha,
          horas,
          descripcion: `Trabajo del ${fecha}`,
          observaciones: "",
          dificultades: "",
          status: "pending",
        }));
        write("store:run", { status: "running", index: 0, pauseMs: 0, phase: "idle", tabId: 1, entries });
      }
    </script>
    <script src="../content/page-hooks.js"></script>
    <script src="../content/content.js"></script>
    <script>
      function check() {
        const run = read("store:run", {});
        if (run.status === "running") return setTimeout(check, 200);
        const saved = read("saved", []);
        const got = saved.map((row) => `${row.fecha} ${row.horas}`).join(", ");
        const want = "01/11/2026 4, 02/11/2026 4, 09/11/2026 8, 10/11/2026 6, 11/11/2026 3";
        const statuses = (run.entries || []).map((entry) => entry.status).join(",");
        const overwritten = read("overwritten", 0);
        const ok = run.status === "done" && got === want && statuses === "done,exists,done" && overwritten === 0;
        document.getElementById("result").textContent = ok
          ? "PASS"
          : `FAIL: status ${run.status} ${run.error || ""} | saved ${got} | entries ${statuses} | overwritten ${overwritten}`;
        document.title = ok ? "PASS" : "FAIL";
      }
      setTimeout(check, 200);
    </script>
  </body>
</html>
